# Builds the BissBTC image on every push to main and publishes it to GitHub Container Registry.
# The VPS (docker-compose.yaml) only pulls this ready-made image - nothing is built on the VPS.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: |
          set -o pipefail
          # on failure, the summary also goes into a workflow annotation (readable without the log)
          pytest -q -rf --tb=line 2>&1 | tee pytest.out || { echo "::error title=pytest::$(grep -E 'FAILED|Error|assert' pytest.out | tail -n 8 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sudeep-sasikumar/bissbtcscanner:latest
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/sudeep-sasikumar/BissBTCScanner
