# BissBTC HTF sweep -> LTF reclaim system. Every value in BUILD_PROMPT.md's {{ }} lives here.
# Percentages are fractions (0.20 = 20%).

data:
  dir: data                      # parquet cache (git-ignored)
  start: "2022-10-01"            # first signal date (prompt section 8.1: Oct 2022 - present)
  warmup_start: "2019-09-01"     # history used to build HTF levels before the first signal
  ltf: 15m

venue:
  weex_base: https://api-contract.weex.com
  binance_fapi: https://fapi.binance.com
  binance_vision: https://data.binance.vision
  # Fallbacks used only when WEEX doesn't return a value (prompt 3.1)
  default_fee_side: 0.0005
  default_lev_cap: {btc_eth: 10, crypto: 5, tradfi: 3}

levels:
  pivot_bars: 2                  # confirmed after N bars each side
  min_move_pct: 0.20             # validation move, max(min_move_pct, k * median bar range)
  k_median_range: 2.5
  validate_within: 10            # N bars
  median_range_lookback: 52      # bars used for the median bar range
  include_opens: [yearly, monthly, weekly]
  include_prior_range: true      # prior month/week high & low
  merge_pct: 0.005
  location_pct: 0.25             # long level in bottom 25% of prior range (mirror for shorts)
  location_lookback_days: 60
  max_level_dist_pct: 0.50       # levels within 50% of the prior close (one-day capitulations: ZEC 5 Jun 2026 fell 46%)

sweep:
  min_atr4h: 0.3                 # sweep_min = 0.3 * ATR(4h)
  max_atr1d: 1.5                 # sweep_max = 1.5 * ATR(daily) -> acceptance
  max_days_below: 3              # daily closes below level -> acceptance
  skip_weekend: true             # sweeps made on a weekend don't trigger
  atr_len: 14

reclaim:
  variants: [R1, R2, R3]
  r1_n_closes: 2
  window_hours: 72
  r3_window_weeks: 3

entry:
  variants: [E1, E2]
  e2_expire_hours: 24
  max_attempts: 2

stop:
  buffer_atr4h: 0.3              # max(0.3 * ATR(4h), 1%)
  buffer_pct: 0.01
  max_stop_pct: 0.12
  early_exit_close_below: false  # variant only

targets:
  min_rr: 2.0                    # skip if TP2 < 2R
  tp1_min_r: 1.0
  deep_dd_prior_high_days: 120
  range_lookback_days: 60

management:
  default: partial_1r_be         # 50% at +1R, stop to entry, rest to TP2
  variants: [partial_1r_be, fixed_2r, fixed_3r, partial_tp1, trail_4h_hl, time_stop]
  time_stop_days: 20

filters:
  regime_flip_days: 2            # 2-3 consecutive days to flip regime
  dd_crypto: [0.30, 0.50]        # 30-50% below 120-day high
  dd_tradfi: [0.10, 0.30]
  dd_lookback_days: 120
  fomc_days: 7                   # +-7 days of an FOMC decision
  quarter_close_days: 3
  earnings_sessions: 2

universe:
  t1: [BTC, ETH, HYPE, SOL, ZEC]
  t2_top_n: 50
  liquidity_floor_usd: 0         # no volume floor (user choice 26 Nov; was $20M 30-day median daily volume)
  rank_lookback_days: 30

sizing:
  risk_pct: [0.02, 0.03, 0.04, 0.05, 0.10]
  default_risk: 0.10              # base risk per trade, scaled by tier_mult (strategy of 26 Nov)
  lev_caps: {BTC: 10, ETH: 10, HYPE: 10, SOL: 10, ZEC: 10, crypto: 5, tradfi: 3}   # T1 10x, T2 5x
  liq_buffer_mult: 1.0           # liq price beyond stop by >= 1x stop distance
  # strong = monthly level, or weekly level with F2 drawdown in band and F1 passing (BTC regime term)
  tier_mult: {strong: 1.0, weekly_only: 0.6, short: 0.5, tradfi: 0.5}
  strong_needs_regime: true      # weekly level needs F2 AND F1 (BTC not in its bull regime) for 1.0x (user choice 26 Nov)
  max_open_risk: 0.60            # total open risk <= 60% of equity
  max_per_cluster: null          # null = no per-cluster position cap
  one_per_symbol_side: true      # one position per coin per side (false = per coin)
  challenge_risk: [0.20, 0.50]   # mode (b), stress test only

costs:
  slippage: {T1: 0.0002, T2: 0.001, T3: 0.003, T4: 0.001}
  tradfi_funding_assumption_8h: 0.0001   # stated assumption when no history

validation:
  split_date: "2024-10-15"       # first half / second half of Oct 2022 - Nov 2026
  holdout_frac: 0.30             # share of symbols held out from design (deterministic hash)
  shuffles: 300
  seed: 7

scanner:
  # PAPER ALERTS ONLY. Strategy of 26 Nov 2026 (user spec): R3w / E2, T1 + T2 crypto, longs and shorts.
  # Backtest (scripts/u12_strategy.py main 200 -> reports/strategy.md; $1,000, 200 orderings): 462 signals,
  # median end $26,011, worst-10% $16,882, median max drawdown 57%. Without the regime term
  # (sizing.strong_needs_regime: false): $21,958 / $14,133 / 62%. User's reference: $25,737 / $15,077 / 55%.
  poll_seconds: 60
  state_file: data/scanner_state.json
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, HYPEUSDT, ZECUSDT]   # T1
  top_n_by_weex_volume: 50       # T1 + the rest of the top 50 WEEX crypto perps by 24h volume = T2
  all_contracts: false           # true = every WEEX contract incl. TradeFi
  crypto_only: true              # no TradeFi
  tiers: [T1, T2]                # used by scripts/u11_profile.py
  reclaim: R3w                   # weekly close back above the swept weekly/monthly level
  entry: E2                      # first 15m pullback that holds the level
  shorts: true
  paper_equity: 1000
  required_filters:              # per side; alerts still show every filter
    long: [F2_drawdown, F3_fomc, F3_qclose, F4_location, stop_max]
    short: [F3_fomc, F3_qclose, F4_location, stop_max]
  # Previous user profile (26 Nov, reports/profile_v2.md): all contracts, both sides [F3_fomc, F3_qclose,
  # stop_max], fomc_days 2, min_atr4h 0, skip_weekend false.
  alert_failed_filters: false    # true = also send near-misses, marked "FILTERS FAILED - info only"
  # Telegram token / chat id come from env: BISS_TG_TOKEN, BISS_TG_CHAT. Never hard-code.
